# Clash Village Tracker - read-only web API configuration.
# This layer serves the historical offline analysis. It does not require a database, a token,
# or any network access to start. The CLI and offline report generation are unaffected.

spring.application.name=clash-village-tracker
server.port=8080

# Paths resolved relative to the process working directory (repository root by default).
tracker.snapshot-path=data/snapshot_2026-10-19.json
tracker.catalog-path=data/upgrade_steps.json
# tracker.previous-snapshot-path=
tracker.gold-pass-boost=0.20
tracker.collections-path=output/supercell/collections

# --- SQL Server persistence (E2) ---------------------------------------------------------------
# Disabled by default so the API always starts and serves the offline dashboard even with no DB.
# Enable with:  --tracker.db.enabled=true   (or set it here)
tracker.db.enabled=false
# Local default instance + dedicated database, SQL authentication with the app login 'clash_app'.
# The password is NEVER stored here: it is read from the CLASH_DB_PASSWORD environment variable.
tracker.db.url=${CLASH_DB_URL:jdbc:sqlserver://localhost;databaseName=clash_village_tracker_dev;encrypt=true;trustServerCertificate=true}
tracker.db.user=${CLASH_DB_USER:clash_app}
tracker.db.password=${CLASH_DB_PASSWORD:}

# Keep responses readable during development.
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
